    Terms: https://www.naturalearthdata.com/about/terms-of-use/
    Projection: equirectangular with standard parallel 45 degrees N.
    Geographic extent: longitude 145 to 52 degrees W; latitude 7 to 84 degrees N.
    Country paths are clipped at these geographic longitude and latitude limits.
    Western Alaska is cropped to remove the unnecessary Pacific longitude span;
    mainland U.S. and Canada remain within the domain. Hawaii is omitted.
    Coastlines simplified with a maximum deviation of 0.35 SVG units.
    Locator bounds: 74 to 71.5 degrees W, 44.5 to 46.5 degrees N,
    following the original study-area map extent, not radar coverage.
  </metadata>
