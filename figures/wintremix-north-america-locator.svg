<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 266" role="img" aria-labelledby="locator-title locator-description" data-longitude-range="-145,-52" data-latitude-range="7,84">
  <title id="locator-title">North America: WINTRE-MIX study region</title>
  <desc id="locator-description">A red box locates the study-area map near Montreal. Longitude is limited to 145 to 52 degrees west for a mainland-focused view; western Alaska and Hawaii are outside the displayed region.</desc>
  <metadata>
    Basemap: Natural Earth 1:110m admin-0 countries, public domain.
